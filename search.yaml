site: stockanalysis
name: search
description: Search stocks, ETFs, and funds on StockAnalysis
domain: stockanalysis.com
strategy: public
browser: true

args:
  query:
    positional: true
    type: str
    required: true
    description: Search keyword, ticker, or company name
  limit:
    type: int
    default: 10
    description: Number of results to return

pipeline:
  - navigate: https://stockanalysis.com/
  - evaluate: |
      (async () => {
        const query = ${{ args.query | json }};
        const limit = ${{ args.limit }};
        const url = `https://stockanalysis.com/symbol-lookup/?q=${encodeURIComponent(query)}`;
        const resp = await fetch(url, { credentials: 'include' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);

        const html = await resp.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const rows = Array.from(doc.querySelectorAll('table tbody tr'));

        const normalize = (value) =>
          String(value || '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '');

        const q = normalize(query);
        const items = rows.map((tr) => {
          const cells = tr.querySelectorAll('td');
          const link = cells[0]?.querySelector('a');
          const symbol = link?.textContent?.trim() || '';
          const href = link?.getAttribute('href') || '';
          const name = cells[1]?.textContent?.trim() || '';
          const type = cells[2]?.textContent?.trim() || '';
          const price = cells[3]?.textContent?.trim() || '';
          const marketCap = cells[4]?.textContent?.trim() || '';

          let score = 0;
          const ns = normalize(symbol);
          const nn = normalize(name);
          if (ns === q) score += 100;
          if (ns.startsWith(q)) score += 40;
          if (nn.startsWith(q)) score += 25;
          if (nn.includes(q)) score += 10;

          return {
            score,
            symbol,
            name,
            type,
            price,
            marketCap,
            url: href ? new URL(href, 'https://stockanalysis.com').toString() : null,
          };
        }).filter((item) => item.symbol || item.name);

        items.sort((a, b) => b.score - a.score);
        return items.slice(0, limit);
      })()

  - map:
      symbol: ${{ item.symbol }}
      name: ${{ item.name }}
      type: ${{ item.type }}
      price: ${{ item.price }}
      marketCap: ${{ item.marketCap }}
      url: ${{ item.url }}

  - limit: ${{ args.limit }}

columns: [symbol, name, type, price, marketCap]
