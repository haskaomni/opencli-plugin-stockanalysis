site: stockanalysis
name: earnings
description: Get earnings calendar data from StockAnalysis
domain: stockanalysis.com
strategy: public
browser: true

args:
  date:
    type: str
    description: Filter by date in YYYY-MM-DD format
  limit:
    type: int
    default: 10
    description: Number of rows to return

pipeline:
  - navigate: https://stockanalysis.com/
  - evaluate: |
      (async () => {
        const requestedDate = String(${{ args.date | json }} || '').trim();
        const limit = ${{ args.limit }};
        const url = 'https://stockanalysis.com/stocks/earnings-calendar/';
        const resp = await fetch(url, { credentials: 'include' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);

        const html = await resp.text();

        const extractBracketed = (source, key, opener = '[', closer = ']') => {
          const keyIndex = source.indexOf(key);
          if (keyIndex === -1) return null;
          const start = source.indexOf(opener, keyIndex + key.length);
          if (start === -1) return null;

          let depth = 0;
          let quote = null;
          let escape = false;

          for (let i = start; i < source.length; i++) {
            const ch = source[i];

            if (quote) {
              if (escape) {
                escape = false;
              } else if (ch === '\\') {
                escape = true;
              } else if (ch === quote) {
                quote = null;
              }
              continue;
            }

            if (ch === '"' || ch === "'") {
              quote = ch;
              continue;
            }

            if (ch === opener) depth++;
            else if (ch === closer) {
              depth--;
              if (depth === 0) return source.slice(start, i + 1);
            }
          }

          return null;
        };

        const compactNumber = (value) => {
          if (value == null || value === '') return null;
          const num = Number(value);
          if (!Number.isFinite(num)) return String(value);

          const abs = Math.abs(num);
          const sign = num < 0 ? '-' : '';
          const units = [
            [1e12, 'T'],
            [1e9, 'B'],
            [1e6, 'M'],
            [1e3, 'K'],
          ];

          for (const [size, suffix] of units) {
            if (abs >= size) {
              const scaled = abs / size;
              const digits = scaled >= 100 ? 0 : scaled >= 10 ? 1 : 2;
              return `${sign}${scaled.toFixed(digits).replace(/\.0+$|(\.\d*[1-9])0+$/, '$1')}${suffix}`;
            }
          }

          return `${num}`;
        };

        const daysSource = extractBracketed(html, 'days:');
        if (!daysSource) throw new Error('Could not locate earnings data block');

        const days = Function(`return (${daysSource});`)();
        const selectedDays = requestedDate ? days.filter((day) => day.date === requestedDate) : days.slice(0, 1);
        if (requestedDate && selectedDays.length === 0) {
          throw new Error(`No earnings data found for ${requestedDate}`);
        }

        const sessionMap = {
          bmo: 'before_open',
          amc: 'after_close',
        };

        return selectedDays
          .flatMap((day) =>
            (day.symbols || []).map((item) => ({
              date: day.date,
              day: day.day,
              session: sessionMap[item.t] || 'unspecified',
              symbol: item.s || '',
              name: item.n || '',
              epsEstimate: item.e == null ? null : `${item.e}`,
              epsGrowth: item.eg == null ? null : `${item.eg}%`,
              revenueEstimate: item.r == null ? null : `$${compactNumber(item.r)}`,
              revenueGrowth: item.rg == null ? null : `${item.rg}%`,
              marketCap: item.m == null ? null : `$${compactNumber(item.m)}`,
              url: item.s ? `https://stockanalysis.com/stocks/${item.s.toLowerCase().replace('.', '-')}/` : null,
            }))
          )
          .slice(0, limit);
      })()

  - map:
      date: ${{ item.date }}
      day: ${{ item.day }}
      session: ${{ item.session }}
      symbol: ${{ item.symbol }}
      name: ${{ item.name }}
      epsEstimate: ${{ item.epsEstimate }}
      epsGrowth: ${{ item.epsGrowth }}
      revenueEstimate: ${{ item.revenueEstimate }}
      revenueGrowth: ${{ item.revenueGrowth }}
      marketCap: ${{ item.marketCap }}
      url: ${{ item.url }}

  - limit: ${{ args.limit }}

columns: [date, session, symbol, name, epsEstimate, revenueEstimate, marketCap]
