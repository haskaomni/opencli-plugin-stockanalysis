site: stockanalysis
name: news
description: Get market news from StockAnalysis
domain: stockanalysis.com
strategy: public
browser: true

args:
  limit:
    type: int
    default: 10
    description: Number of rows to return

pipeline:
  - navigate: https://stockanalysis.com/
  - evaluate: |
      (async () => {
        const limit = ${{ args.limit }};
        const url = 'https://stockanalysis.com/news/';
        const resp = await fetch(url, { credentials: 'include' });
        if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);

        const html = await resp.text();

        const extractBracketed = (source, key, opener = '[', closer = ']') => {
          const keyIndex = source.indexOf(key);
          if (keyIndex === -1) return null;
          const start = source.indexOf(opener, keyIndex + key.length);
          if (start === -1) return null;

          let depth = 0;
          let quote = null;
          let escape = false;

          for (let i = start; i < source.length; i++) {
            const ch = source[i];

            if (quote) {
              if (escape) {
                escape = false;
              } else if (ch === '\\') {
                escape = true;
              } else if (ch === quote) {
                quote = null;
              }
              continue;
            }

            if (ch === '"' || ch === "'") {
              quote = ch;
              continue;
            }

            if (ch === opener) depth++;
            else if (ch === closer) {
              depth--;
              if (depth === 0) return source.slice(start, i + 1);
            }
          }

          return null;
        };

        const mainSource = extractBracketed(html, 'data:{data:');
        const otherSource = extractBracketed(html, 'other:');
        const main = mainSource ? Function(`return (${mainSource});`)() : [];
        const other = otherSource ? Function(`return (${otherSource});`)() : [];

        const normalizeUrl = (value) => {
          if (!value) return null;
          if (/^https?:\/\//i.test(value)) return value;
          return value;
        };

        const items = [
          ...main.map((item) => ({
            source: item.source || '',
            type: item.type || 'Article',
            title: item.title || '',
            summary: item.text || '',
            time: item.time || null,
            ago: item.ago || null,
            url: normalizeUrl(item.url),
          })),
          ...other.map((item) => ({
            source: item.n || '',
            type: 'Headline',
            title: item.t || '',
            summary: null,
            time: null,
            ago: item.d || null,
            url: normalizeUrl(item.u),
          })),
        ].filter((item) => item.title);

        const seen = new Set();
        const deduped = [];
        for (const item of items) {
          const key = `${item.url || ''}::${item.title}`;
          if (seen.has(key)) continue;
          seen.add(key);
          deduped.push(item);
          if (deduped.length >= limit) break;
        }

        return deduped;
      })()

  - map:
      source: ${{ item.source }}
      type: ${{ item.type }}
      title: ${{ item.title }}
      summary: ${{ item.summary }}
      time: ${{ item.time }}
      ago: ${{ item.ago }}
      url: ${{ item.url }}

  - limit: ${{ args.limit }}

columns: [source, type, title, ago, time]
