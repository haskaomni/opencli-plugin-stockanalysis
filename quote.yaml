site: stockanalysis
name: quote
description: Get a stock overview from StockAnalysis
domain: stockanalysis.com
strategy: public
browser: true

args:
  symbol:
    positional: true
    type: str
    required: true
    description: Ticker symbol, for example AAPL or MSFT

pipeline:
  - navigate: https://stockanalysis.com/
  - evaluate: |
      (async () => {
        const rawSymbol = String(${{ args.symbol | json }} || '').trim();
        const query = rawSymbol.toUpperCase();
        const lookupUrl = `https://stockanalysis.com/symbol-lookup/?q=${encodeURIComponent(query)}`;

        const lookupResp = await fetch(lookupUrl, { credentials: 'include' });
        if (!lookupResp.ok) throw new Error(`HTTP ${lookupResp.status} for ${lookupUrl}`);

        const lookupHtml = await lookupResp.text();
        const lookupDoc = new DOMParser().parseFromString(lookupHtml, 'text/html');
        const rows = Array.from(lookupDoc.querySelectorAll('table tbody tr'));

        const normalize = (value) =>
          String(value || '')
            .toUpperCase()
            .replace(/[^A-Z0-9]+/g, '');

        const wanted = normalize(query);
        const candidates = rows.map((tr) => {
          const cells = tr.querySelectorAll('td');
          const link = cells[0]?.querySelector('a');
          const symbol = link?.textContent?.trim() || '';
          const href = link?.getAttribute('href') || '';
          const name = cells[1]?.textContent?.trim() || '';
          const type = cells[2]?.textContent?.trim() || '';
          const price = cells[3]?.textContent?.trim() || '';
          const marketCap = cells[4]?.textContent?.trim() || '';
          const normalizedSymbol = normalize(symbol);
          const plainSymbol = normalize(symbol.split(':').pop() || symbol);

          let score = 0;
          if (normalizedSymbol === wanted || plainSymbol === wanted) score += 100;
          if (normalizedSymbol.endsWith(wanted) || plainSymbol.endsWith(wanted)) score += 50;
          if (type === 'Stock') score += 20;

          return {
            score,
            symbol,
            name,
            type,
            price,
            marketCap,
            detailUrl: href ? new URL(href, 'https://stockanalysis.com').toString() : null,
          };
        }).filter((item) => item.detailUrl);

        candidates.sort((a, b) => b.score - a.score);
        const pick = candidates[0];
        if (!pick) throw new Error(`No StockAnalysis result found for ${query}`);

        const detailResp = await fetch(pick.detailUrl, { credentials: 'include' });
        if (!detailResp.ok) throw new Error(`HTTP ${detailResp.status} for ${pick.detailUrl}`);
        const detailHtml = await detailResp.text();

        const capture = (re) => detailHtml.match(re)?.[1] || null;

        return [{
          symbol: pick.symbol,
          name: pick.name,
          type: pick.type,
          price: pick.price,
          marketCap: capture(/marketCap:"([^"]+)"/) || pick.marketCap,
          peRatio: capture(/peRatio:"([^"]+)"/),
          eps: capture(/eps:"([^"]+)"/),
          revenue: capture(/revenue:"([^"]+)"/),
          analystTarget: capture(/analystTarget:\{target:"([^"]+)"/),
          analystUpside: capture(/analystTarget:\{target:"[^"]+",change:"([^"]+)"/),
          url: pick.detailUrl,
        }];
      })()

  - map:
      symbol: ${{ item.symbol }}
      name: ${{ item.name }}
      type: ${{ item.type }}
      price: ${{ item.price }}
      marketCap: ${{ item.marketCap }}
      peRatio: ${{ item.peRatio }}
      eps: ${{ item.eps }}
      revenue: ${{ item.revenue }}
      analystTarget: ${{ item.analystTarget }}
      analystUpside: ${{ item.analystUpside }}
      url: ${{ item.url }}

columns: [symbol, name, price, marketCap, peRatio, eps, revenue, analystTarget, analystUpside]
